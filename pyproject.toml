[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uyap-udf-mcp"
version = "1.0.0"
description = "UYAP UDF Document & PDF Converter MCP Server"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.10.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "qrcode>=7.0",
    "pypdf>=5.0.0",
]

[tool.setuptools]
py-modules = ["server", "java_bridge", "pdf_converter", "udf"]
